<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>俄羅斯方塊</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;background:linear-gradient(135deg,#fce4ec,#f8bbd9);height:100vh;height:100dvh;display:flex;justify-content:center;align-items:stretch;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#333}
.app{width:100%;max-width:460px;max-height:820px;height:100%;align-self:center;background:#fff;border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(233,30,99,.2);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{background:#2196f3;width:34px;height:34px;border-radius:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:7px}
.logo-icon i{background:#fff;border-radius:2px}
.title{font-size:21px;font-weight:bold}
.stage{flex:1 1 0;min-height:0;display:flex;gap:8px}
.boardwrap{flex:1;min-width:0;position:relative}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;box-sizing:content-box;border:3px solid #c2185b;border-radius:6px;background:#fff}
.side{width:84px;display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.box{background:#fce4ec;border-radius:12px;padding:6px 4px;text-align:center}
.box span{display:block;font-size:11px;color:#c2185b}
.box b{font-size:17px;font-variant-numeric:tabular-nums}
.box small{display:block;font-size:12px;color:#777;margin-top:2px}
#next{display:block;margin:2px auto 0}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{background:linear-gradient(145deg,#d48ca8,#c77a96);color:#fff;border:0;border-radius:14px;height:54px;font:inherit;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:3px 3px 6px rgba(0,0,0,.2);touch-action:none}
.btn:active{box-shadow:inset 2px 2px 4px rgba(0,0,0,.25);transform:scale(.97)}
.btn.rot{background:linear-gradient(145deg,#ec407a,#c2185b)}
.btn.pause{background:linear-gradient(145deg,#ffb74d,#ff9800);font-size:18px}
.btn.sm{height:auto;padding:8px 14px;font-size:14px;touch-action:manipulation}
.keys{margin-top:8px;text-align:center;font-size:12px;color:#999}
@media(hover:none){.keys{display:none}}
.ov{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#fff;border:3px solid #e91e63;border-radius:20px;padding:22px 28px;text-align:center;box-shadow:0 10px 30px rgba(233,30,99,.35);display:none;z-index:10;max-width:88vw}
.ov h2{margin:0 0 8px;color:#c2185b}
.ov p{margin:6px 0}
#pausecard{pointer-events:none}
@media(max-height:640px){.btn{height:46px;font-size:20px}.box{padding:4px}.side{gap:4px}}
@media(orientation:landscape) and (max-height:500px){
  .app{display:grid;grid-template-columns:1fr 210px;grid-template-rows:auto 1fr;gap:6px 14px;padding:10px;max-width:none}
  header{grid-column:1/3;margin:0}
  .stage{grid-column:1;grid-row:2}
  .controls{grid-column:2;grid-row:2;align-self:center;margin:0}
  .keys{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="logo-icon"><i></i><i></i><i></i><i></i></div><div class="title">俄羅斯方塊</div></div>
    <button class="btn sm" id="newBtn">新遊戲</button>
  </header>
  <div class="stage">
    <div class="boardwrap" id="wrap"><canvas id="board"></canvas></div>
    <aside class="side">
      <div class="box"><span>下一個</span><canvas id="next"></canvas></div>
      <div class="box"><span>分數</span><b id="score">0</b></div>
      <div class="box"><span>最高分</span><b id="best">0</b></div>
      <div class="box"><span>等級</span><b id="level">1</b><small>行數 <span id="lines" style="display:inline;color:inherit;font-size:inherit">0</span></small></div>
    </aside>
  </div>
  <div class="controls">
    <button class="btn" id="leftBtn" aria-label="左移">←</button>
    <button class="btn rot" id="rotBtn" aria-label="旋轉">↻</button>
    <button class="btn" id="rightBtn" aria-label="右移">→</button>
    <button class="btn pause" id="pauseBtn" aria-label="暫停">暫停</button>
    <button class="btn" id="downBtn" aria-label="軟降（按住加速）">↓</button>
    <button class="btn rot" id="dropBtn" aria-label="瞬降">⤓</button>
  </div>
  <div class="keys">鍵盤：←→ 移動｜↑ 旋轉｜↓ 軟降｜空白鍵 瞬降｜P 暫停</div>
</div>

<div class="ov" id="over">
  <h2>遊戲結束</h2>
  <p>分數：<b id="final">0</b></p>
  <p id="record" style="display:none;color:#e91e63;font-weight:bold">🏆 新紀錄！</p>
  <button class="btn sm" id="againBtn" style="margin-top:10px">再玩一次</button>
</div>
<div class="ov" id="pausecard"><h2>遊戲暫停</h2><p>按「繼續」回到遊戲</p></div>

<script>
const COLS = 10, ROWS = 16, dpr = Math.min(window.devicePixelRatio || 1, 3);
const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d'), nx = $('next'), nctx = nx.getContext('2d'), wrap = $('wrap');
const PIECES = [
  { s: [[1, 1, 1, 1]], c: '#29b6f6' },
  { s: [[1, 1], [1, 1]], c: '#ffca28' },
  { s: [[0, 1, 0], [1, 1, 1]], c: '#ab47bc' },
  { s: [[1, 0, 0], [1, 1, 1]], c: '#ff9800' },
  { s: [[0, 0, 1], [1, 1, 1]], c: '#5c6bc0' },
  { s: [[1, 1, 0], [0, 1, 1]], c: '#66bb6a' },
  { s: [[0, 1, 1], [1, 1, 0]], c: '#ef5350' }
];
let board, cur, nextIdx, bag = [], score = 0, level = 1, lines = 0, best = 0, prevBest = 0;
let running = false, paused = false, interval = 1000, acc = 0, last = 0, raf = 0, cell = 20;
try { best = +localStorage.getItem('tetris_best') || 0; } catch (e) {}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fromBag = () => { if (!bag.length) bag = shuffle([0, 1, 2, 3, 4, 5, 6]); return bag.pop(); }; // 7-bag

function hit(s, x, y) {
    for (let r = 0; r < s.length; r++) for (let c = 0; c < s[r].length; c++) if (s[r][c]) {
        const bx = x + c, by = y + r;
        if (bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && board[by][bx])) return true;
    }
    return false;
}
function spawn() {
    const p = PIECES[nextIdx];
    cur = { s: p.s.map(r => r.slice()), c: p.c, x: (COLS - p.s[0].length) / 2 | 0, y: 0 };
    nextIdx = fromBag(); drawNext();
    if (hit(cur.s, cur.x, cur.y)) end();
}
function move(dx, dy) {
    if (hit(cur.s, cur.x + dx, cur.y + dy)) return false;
    cur.x += dx; cur.y += dy; return true;
}
function rotate() {
    const h = cur.s.length, w = cur.s[0].length, r = [];
    for (let x = 0; x < w; x++) { r[x] = []; for (let y = h - 1; y >= 0; y--) r[x][h - 1 - y] = cur.s[y][x]; }
    for (const dx of [0, 1, -1, 2, -2]) // 踢牆：旋轉卡住時嘗試左右位移
        if (!hit(r, cur.x + dx, cur.y)) { cur.s = r; cur.x += dx; return; }
}
function clearLines() {
    let n = 0;
    for (let y = ROWS - 1; y >= 0; y--) if (board[y].every(Boolean)) {
        board.splice(y, 1); board.unshift(Array(COLS).fill(0)); n++; y++;
    }
    if (n) {
        lines += n; score += [0, 100, 300, 500, 800][n] * level;
        level = (lines / 10 | 0) + 1; interval = Math.max(300, 1000 - (level - 1) * 80);
    }
}
function lock() {
    cur.s.forEach((row, r) => row.forEach((v, c) => { if (v) board[cur.y + r][cur.x + c] = cur.c; }));
    clearLines(); acc = 0; spawn(); ui();
}
function softDrop() { if (move(0, 1)) { score++; ui(); } else lock(); }
function hardDrop() { let n = 0; while (move(0, 1)) n++; score += n; lock(); } // 瞬降：立刻鎖定
function ghostY() { let y = cur.y; while (!hit(cur.s, cur.x, y + 1)) y++; return y; }

function ui() {
    if (score > best) best = score;
    $('score').textContent = score.toLocaleString();
    $('best').textContent = best.toLocaleString();
    $('level').textContent = level;
    $('lines').textContent = lines;
}
function end() {
    running = false;
    $('final').textContent = score.toLocaleString();
    $('record').style.display = score > prevBest ? 'block' : 'none';
    try { localStorage.setItem('tetris_best', best); } catch (e) {}
    $('over').style.display = 'block';
}

/* ---------- 繪圖 ---------- */
function block(g, x, y, c, sz) {
    const px = x * sz, py = y * sz, t = Math.max(2, sz * .13);
    g.fillStyle = c; g.fillRect(px + 1, py + 1, sz - 2, sz - 2);
    g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(px + 1, py + 1, sz - 2, t); g.fillRect(px + 1, py + 1, t, sz - 2);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(px + sz - 1 - t, py + 1, t, sz - 2); g.fillRect(px + 1, py + sz - 1 - t, sz - 2, t);
}
function draw() {
    if (!board) return;
    const W = COLS * cell, H = ROWS * cell;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(194,24,91,.12)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, H); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * cell + .5); ctx.lineTo(W, y * cell + .5); }
    ctx.stroke();
    board.forEach((row, y) => row.forEach((c, x) => c && block(ctx, x, y, c, cell)));
    if (cur && running) {
        const gy = ghostY();
        cur.s.forEach((row, r) => row.forEach((v, c) => {
            if (!v) return;
            const px = (cur.x + c) * cell, py = (gy + r) * cell;
            ctx.globalAlpha = .2; ctx.fillStyle = cur.c; ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
            ctx.globalAlpha = .7; ctx.strokeStyle = cur.c; ctx.lineWidth = 2; ctx.strokeRect(px + 2, py + 2, cell - 4, cell - 4);
            ctx.globalAlpha = 1;
        }));
        cur.s.forEach((row, r) => row.forEach((v, c) => v && block(ctx, cur.x + c, cur.y + r, cur.c, cell)));
    }
}
function drawNext() {
    nctx.clearRect(0, 0, 64, 64);
    const p = PIECES[nextIdx], sz = 16, ox = (64 - p.s[0].length * sz) / 2 / sz, oy = (64 - p.s.length * sz) / 2 / sz;
    p.s.forEach((row, r) => row.forEach((v, c) => v && block(nctx, ox + c, oy + r, p.c, sz)));
}
function fit() { // 依可用空間決定格子大小，並依螢幕密度放大內部解析度，畫面才清晰
    const w = wrap.clientWidth, h = wrap.clientHeight;
    cell = Math.max(10, Math.floor(Math.min((w - 6) / COLS, (h - 6) / ROWS)));
    const cw = cell * COLS, ch = cell * ROWS;
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = cw * dpr; cv.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
}

/* ---------- 流程 ---------- */
function loop(t) {
    if (!running || paused) { raf = 0; return; }
    acc += Math.min(Math.max(t - last, 0), 100); last = t;
    if (acc >= interval) { acc = 0; if (!move(0, 1)) lock(); }
    draw(); raf = requestAnimationFrame(loop);
}
function run() { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop); }
function togglePause() {
    if (!running) return;
    paused = !paused;
    $('pauseBtn').textContent = paused ? '繼續' : '暫停';
    $('pausecard').style.display = paused ? 'block' : 'none';
    if (paused) draw(); else run(); // 繼續時重新計時，不會立刻掉一格
}
function start() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    bag = []; score = 0; level = 1; lines = 0; interval = 1000; acc = 0; paused = false; running = true; prevBest = best;
    $('over').style.display = $('pausecard').style.display = 'none';
    $('pauseBtn').textContent = '暫停';
    nextIdx = fromBag(); spawn(); ui(); run();
}

/* ---------- 操作 ---------- */
const stops = [];
function bind(id, fn, rep) { // pointer 事件同時支援觸控與滑鼠；rep 為長按連續觸發的間隔
    const el = $(id); let d = 0, t = 0;
    const stop = () => { clearTimeout(d); clearInterval(t); };
    stops.push(stop);
    el.addEventListener('pointerdown', e => { e.preventDefault(); stop(); fn(); if (rep) d = setTimeout(() => { t = setInterval(fn, rep); }, 180); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => el.addEventListener(n, stop));
    el.addEventListener('contextmenu', e => e.preventDefault());
}
const G = f => () => { if (running && !paused) { f(); draw(); } };
bind('leftBtn', G(() => move(-1, 0)), 65);
bind('rightBtn', G(() => move(1, 0)), 65);
bind('downBtn', G(softDrop), 50);
bind('rotBtn', G(rotate));
bind('dropBtn', G(hardDrop));
bind('pauseBtn', togglePause);
$('againBtn').onclick = start;
$('newBtn').onclick = () => { if (running && score > 0 && !confirm('目前的遊戲還沒結束，確定要開始新遊戲嗎？')) return; start(); };

addEventListener('keydown', e => {
    const k = e.code;
    if (k === 'KeyP' || k === 'Escape') { if (!e.repeat) togglePause(); return; }
    if (!running || paused) return;
    const act = { ArrowLeft: () => move(-1, 0), ArrowRight: () => move(1, 0), ArrowDown: softDrop, ArrowUp: rotate, KeyX: rotate, Space: hardDrop }[k];
    if (!act) return;
    e.preventDefault();
    if (e.repeat && (k === 'ArrowUp' || k === 'KeyX' || k === 'Space')) return;
    act(); draw();
});
document.addEventListener('visibilitychange', () => { // 切到別的 App 或分頁時自動暫停
    if (document.hidden) { stops.forEach(s => s()); if (running && !paused) togglePause(); }
});

/* ---------- 初始化 ---------- */
nx.style.width = nx.style.height = '64px';
nx.width = nx.height = 64 * dpr;
nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
start();
new ResizeObserver(fit).observe(wrap); // 轉動螢幕或縮放視窗時只重新計算大小，不會重載、不會丟掉進度
fit();
</script>
</body>
</html>

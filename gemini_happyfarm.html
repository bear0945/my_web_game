<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂農場 - 四季守護版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
        }

        body.spring-mode {
            background: linear-gradient(135deg, #FFD1DC, #B5EAD7);
        }
        
        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .title {
            color: #2E8B57;
            font-size: 2.2em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 0.9em;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #F0F8FF;
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid #4682B4;
            font-weight: bold;
            color: #2E8B57;
        }
        
        .upgrade-section {
            background: #E6E6FA;
            border: 2px solid #9370DB;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .upgrade-btn {
            background: #9370DB;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        
        .upgrade-btn:hover:not(:disabled) {
            background: #7B68EE;
            transform: translateY(-1px);
        }
        
        .upgrade-btn:disabled {
            background: #B8B8C8;
            color: #F0F0F0;
            cursor: not-allowed;
        }

        .upgrade-btn.maxed {
            background: #5A9E6F;
            color: #FFFFFF;
            cursor: default;
        }

        .pause-btn {
            background: #FF8C00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(255, 140, 0, 0.3);
        }

        .pause-btn:hover {
            background: #E07B00;
            transform: translateY(-1px);
        }

        .pause-btn.paused {
            background: #28A745;
            animation: pulse 1.2s infinite;
        }

        .finish-btn {
            background: #17A2B8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            display: none;
        }

        .finish-btn:hover {
            background: #138496;
        }

        .farm-wrapper {
            position: relative;
            margin: 15px auto;
        }
        
        .farm-grid {
            --plot-size: 60px;
            --plot-gap: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--plot-gap);
            margin: 0 auto;
            max-width: 320px;
            transition: filter 0.3s ease;
        }

        .farm-grid.paused-blur {
            filter: blur(4px) grayscale(40%);
            pointer-events: none;
            user-select: none;
        }

        .pause-banner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.4em;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .pause-banner.active {
            display: block;
        }
        
        .plot {
            flex: none;
            width: var(--plot-size);
            height: var(--plot-size);
            border: 3px solid #8B4513;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.3s ease;
            font-size: 1.5em;
            background: #DEB887;
            user-select: none;
        }
        
        @media (min-width: 480px) {
            .farm-grid {
                --plot-size: 80px;
            }
            .plot {
                font-size: 2em;
            }
        }
        
        .plot:hover {
            transform: scale(1.06);
            border-color: #654321;
        }

        .plot:active {
            transform: scale(0.95);
        }
        
        .plot.planted {
            background: #90EE90;
        }
        
        .plot.ready {
            background: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        
        .plot.bear {
            background: #8B4513;
            animation: shake 0.5s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .plot.wild-boar {
            background: #A0522D;
            animation: shake 0.3s infinite, danger-glow 0.8s infinite alternate;
        }
        
        @keyframes danger-glow {
            from { box-shadow: 0 0 5px #FF0000; border-color: #FF0000; }
            to { box-shadow: 0 0 18px #FF4444; border-color: #FFAA00; }
        }
        
        .plot.destroyed {
            background: #696969;
            cursor: not-allowed;
        }
        
        .plot.destroyed:hover {
            transform: none;
            border-color: #8B4513;
        }
        
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }
        
        .game-over-modal {
            background: white;
            padding: 30px 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            animation: modal-fade-in 0.25s ease-out;
        }

        @keyframes modal-fade-in {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .game-over-title {
            color: #DC3545;
            font-size: 1.9em;
            margin-bottom: 12px;
        }

        .victory-title {
            color: #17A2B8;
            font-size: 1.8em;
            margin-bottom: 12px;
        }
        
        .final-score {
            font-size: 1.25em;
            color: #28A745;
            margin: 15px 0;
            line-height: 1.6;
            font-weight: bold;
        }

        .winter-stamp {
            display: inline-block;
            border: 4px double #007BFF;
            color: #007BFF;
            background: rgba(240, 248, 255, 0.92);
            padding: 6px 18px;
            font-size: 1.35em;
            font-weight: 900;
            border-radius: 8px;
            transform: rotate(-8deg);
            margin: 10px 0 5px 0;
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.25);
            letter-spacing: 2px;
            animation: stamp-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes stamp-pop {
            0% { transform: scale(2.5) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(-8deg); opacity: 1; }
        }
        
        .restart-btn {
            background: #007BFF;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 5px;
            transition: all 0.2s;
        }
        
        .restart-btn:hover:not(:disabled) {
            background: #0056B3;
            transform: translateY(-1px);
        }

        .endless-btn {
            background: #28A745;
        }

        .endless-btn:hover:not(:disabled) {
            background: #1E7E34;
        }

        /* 防誤觸鎖定狀態樣式 */
        .restart-btn:disabled {
            background: #ADB5BD !important;
            color: #F8F9FA !important;
            cursor: not-allowed !important;
            opacity: 0.7;
            transform: none !important;
        }
        
        .leaderboard {
            background: #F8F9FA;
            border-radius: 8px;
            padding: 12px 15px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }
        
        .leaderboard h4 {
            margin-bottom: 10px;
            color: #495057;
            text-align: center;
        }
        
        .score-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px solid #DEE2E6;
            font-size: 0.95em;
        }

        .score-entry.current-score {
            background: #FFF3CD;
            font-weight: bold;
            border-radius: 4px;
        }
        
        .score-entry:last-child {
            border-bottom: none;
        }
        
        .shop {
            background: #F5F5DC;
            border: 2px solid #D2691E;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .shop h3 {
            color: #8B4513;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .seeds {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .seed-option {
            background: #FFF8DC;
            border: 2px solid #DAA520;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 112px;
            user-select: none;
        }
        
        .seed-option:hover {
            background: #F0E68C;
            transform: translateY(-2px);
        }
        
        .seed-option.selected {
            background: #FFD700;
            border-color: #B8860B;
            box-shadow: 0 2px 8px rgba(184, 134, 11, 0.3);
        }
        
        .seed-name {
            font-weight: bold;
            color: #8B4513;
            margin-bottom: 2px;
        }
        
        .seed-price {
            color: #006400;
            font-size: 0.88em;
            font-weight: bold;
        }
        
        .seed-time {
            color: #555;
            font-size: 0.78em;
            margin-top: 2px;
        }
        
        .message {
            text-align: center;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">🌱 快樂農場 🌱</h1>
            <div class="subtitle">1~24級安心種田發育，25級山豬出沒，撐到50級迎接冬天！（P 或 空白鍵 暫停）</div>
        </div>
        
        <div class="stats">
            <div class="stat">💰 現有金幣: <span id="money">250</span></div>
            <div class="stat">📈 累計金幣: <span id="totalEarned">0</span></div>
            <div class="stat">📊 等級: <span id="level">1</span></div>
            <div class="stat">⭐ 經驗: <span id="exp">0</span>/<span id="expNeeded">5</span></div>
        </div>
        
        <div class="upgrade-section">
            <button class="upgrade-btn" id="upgradePlots"></button>
            <button class="upgrade-btn" id="upgradeSpeed"></button>
            <button class="pause-btn" id="pauseBtn">⏸️ 暫停遊戲 (P)</button>
            <button class="finish-btn" id="finishEndlessBtn">🏆 隨時結算</button>
        </div>
        
        <div class="farm-wrapper">
            <div class="farm-grid" id="farmGrid"></div>
            <div class="pause-banner" id="pauseBanner">⏸️ 遊戲已暫停</div>
        </div>
        
        <div id="message" class="message" style="background: #FFF3CD; color: #856404; border: 2px solid #FFEAA7;">
            歡迎來到快樂農場！趁 25 級山豬出沒前，盡情擴展農田、存錢種南瓜吧！
        </div>
        
        <div class="shop">
            <h3>🛒 種子商店</h3>
            <div class="seeds" id="seedShop"></div>
        </div>
    </div>

                    potato:     { name: '馬鈴薯', price: 50,   time: 5500,  value: 95,   exp: 3, emoji: '🥔' },
                    tomato:     { name: '番茄',   price: 120,  time: 8000,  value: 230,  exp: 4,

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂農場 - 四季守護版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #87CEEB, #98FB98);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
        }

        body.spring-mode {
            background: linear-gradient(135deg, #FFD1DC, #B5EAD7);
        }
        
        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .title {
            color: #2E8B57;
            font-size: 2.2em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 0.9em;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #F0F8FF;
            padding: 8px 15px;
            border-radius: 10px;
            border: 2px solid #4682B4;
            font-weight: bold;
            color: #2E8B57;
        }
        
        .upgrade-section {
            background: #E6E6FA;
            border: 2px solid #9370DB;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .upgrade-btn {
            background: #9370DB;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        
        .upgrade-btn:hover:not(:disabled) {
            background: #7B68EE;
            transform: translateY(-1px);
        }
        
        .upgrade-btn:disabled {
            background: #B8B8C8;
            color: #F0F0F0;
            cursor: not-allowed;
        }
